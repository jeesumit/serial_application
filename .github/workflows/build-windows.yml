name: Build Windows installer
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: Install dependencies
        run: python -m pip install -r requirements-desktop.txt
      - name: Build app (PyInstaller)
        run: pyinstaller --noconfirm serial_monitor.spec
      - name: Self-test packaged exe
        shell: pwsh
        run: |
          $p = Start-Process dist\SerialMonitor\SerialMonitor.exe -ArgumentList '--selftest','--data-dir',"$env:RUNNER_TEMP\smtest" -Wait -PassThru
          Get-Content "$env:RUNNER_TEMP\smtest\selftest.txt"
          if ($p.ExitCode -ne 0) { throw "selftest failed ($($p.ExitCode))" }
      - name: Fetch WebView2 bootstrapper
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force redist | Out-Null
          Invoke-WebRequest https://go.microsoft.com/fwlink/p/?LinkId=2124703 -OutFile redist\MicrosoftEdgeWebview2Setup.exe
      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          $v = (Get-Content VERSION).Trim()
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          & $iscc "/DAppVersion=$v" installer.iss
          Compress-Archive -Force dist\SerialMonitor "dist\SerialMonitor-$v-portable.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: SerialMonitor-windows
          path: |
            dist/SerialMonitor-Setup-*.exe
            dist/SerialMonitor-*-portable.zip
      - name: Attach to GitHub release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/SerialMonitor-Setup-*.exe
            dist/SerialMonitor-*-portable.zip
